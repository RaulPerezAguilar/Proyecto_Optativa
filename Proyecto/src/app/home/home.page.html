<!-- Contenido de: src/app/home/home.page.html -->

<!-- La cabecera principal, visible en la parte superior de la pantalla -->
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title style="font-family: 'Courier New', Courier, monospace; font-size: x-large;">
      Lista de videojuegos pendientes
    </ion-title>

    <ion-buttons slot="end">
      <ion-button routerLink="/ajustes">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Esta segunda cabecera crea el efecto de título grande que se encoge al hacer scroll -->
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">
        <i class="bi bi-joystick"></i>
        Lista de videojuegos pendientes
      </ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Directiva *ngIf: este div solo existirá en el DOM si la condición es verdadera -->
  <div *ngIf="listaDeTareas.length === 0" class="mensaje-vacio">
    <p>¡Enhorabuena!</p>
    <p>No tienes videojuegos pendientes.</p>
  </div>

  <!-- 
    Directiva *ngFor: este es el bucle. 
    - Por cada objeto 'tarea' que haya en el array 'listaDeTareas'...
    - ...Angular creará una instancia de nuestro componente <app-task-item>.
  -->
  <ion-grid>
    <ion-row>
      <ion-col
        *ngFor="let nombre of listaDeTareas"
        size="6"
        size-md="4"
        size-lg="3">
        <app-task-item [videojuegos]="nombre"></app-task-item>
      </ion-col>
    </ion-row>
  </ion-grid>
  
  
  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-title>
        Perfil de Usuario
      </ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Aquí empieza nuestro contenido personalizado -->
  <!-- Al añadir .ion-align-items-center a la fila, centramos verticalmente ambas columnas -->
<ion-row class="ion-align-items-center">
  <!-- Columna de la imagen -->
  <ion-col size="12" size-md="4">
    <img src="https://tse3.mm.bing.net/th/id/OIP._anxl2wqCtJStS2ZJg6nLQHaLH?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Avatar de usuario" style="border-radius: 8px;"/>
  </ion-col>

  <!-- Columna de texto -->
  <ion-col size="12" size-md="8">
    <div class="ion-text-center">
      <p>Este es el texto descriptivo del perfil. Ahora está perfectamente centrado.</p>
      <ion-button>Contactar</ion-button>
    </div>
  </ion-col>
</ion-row>



</ion-content>
